# OPTIONAL — only needed for files > 20 MB download / 50 MB upload.
# For local-first dev with small files (TikTok/IG clips, mp3s) you can skip this
# and just run `python -m bot.main`. Bring this up when Feature D/C hit big files.
#
#   docker compose up -d telegram-bot-api
#   then set LOCAL_BOT_API_URL=http://localhost:8081 in .env
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
